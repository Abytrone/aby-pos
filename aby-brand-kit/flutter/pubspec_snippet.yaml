# Merge into your pubspec.yaml.
# Copy: aby-brand-kit/fonts/*.ttf (the static ones) -> fonts/
#       aby-brand-kit/logos/svg/*.svg -> assets/brand/
#       aby-brand-kit/ui-icons/*.svg  -> assets/icons/ui/
#       aby-brand-kit/samples/png/*.png -> assets/samples/   (demo data only; replace with real photos)

dependencies:
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  assets:
    - assets/brand/
    - assets/icons/ui/
    - assets/samples/
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
        - asset: fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: fonts/Figtree-Black.ttf
          weight: 900
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
