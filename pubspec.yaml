name: aby_pos
description: "Aby point of sale"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_svg: ^2.3.0
  get: ^4.7.3
  uuid: ^4.6.0
  crypto: ^3.0.7
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.7.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Brand kit (brand/flutter/pubspec_snippet.yaml).
  assets:
    - assets/brand/
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
        - asset: fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: fonts/Figtree-Black.ttf
          weight: 900
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
